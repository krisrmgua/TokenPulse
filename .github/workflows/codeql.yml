# GitHub CodeQL on every pull request. Public repos get this free.
# A finding fails the check. main requires this check, so a request cannot merge until it is clean.
#
# pull_request_target also runs for same-repo bot PRs (GITHUB_TOKEN pushes do not
# fire pull_request workflows). Fork PRs are skipped on that path.
name: code-scanning

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL scan
    if: >-
      github.event_name == 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: always

      - name: Fail the check when CodeQL finds anything
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::CodeQL did not produce a results file."
            exit 1
          fi
          count=0
          for file in "${files[@]}"; do
            n="$(jq '[.runs[].results[]?] | length' "$file")"
            count=$((count + n))
            jq -r '.runs[].results[]? | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' "$file"
          done
          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found ${count} finding(s). Fix them before merging."
            exit 1
          fi
          echo "CodeQL found nothing."
