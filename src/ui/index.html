<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenPulse</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top" id="top">
        <div class="brand-row">
          <svg class="mark" viewBox="196 196 632 632" aria-hidden="true">
            <circle cx="512" cy="512" r="276" class="mark-track" />
            <path class="mark-arc" d="M 723.4 334.6 A 276 276 0 1 0 689.4 723.4" />
            <polyline class="mark-pulse" points="245,512 385,512 448,389 545,654 610,512 780,512" />
          </svg>
          <div>
            <div class="brand">TokenPulse</div>
            <div class="sub" id="updated">Connecting to your sources…</div>
          </div>
        </div>
        <div class="top-actions">
          <span class="spinner hidden" id="spinner" aria-label="Refreshing"></span>
          <button class="btn icon" id="btn-back" title="Back" hidden>
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                d="M10 3 L5 8 L10 13"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="btn icon" id="btn-refresh" title="Refresh (⌘R)" aria-label="Refresh">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                d="M13 8a5 5 0 1 1-1.2-3.3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <path d="M13 2.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="btn icon" id="btn-options" title="Preferences" aria-label="Preferences">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M8 1.6l.7 1.6 1.7.2.9 1.4 1.4-.4.9 1.5-1 1.1v1.6l1 1.1-.9 1.5-1.4-.4-.9 1.4-1.7.2L8 14.4l-.7-1.6-1.7-.2-.9-1.4-1.4.4-.9-1.5 1-1.1V7.4l-1-1.1.9-1.5 1.4.4.9-1.4 1.7-.2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>
      <nav class="tabbar" id="tabbar">
        <div class="tabs">
          <button class="tab" data-route="overview">Overview</button>
          <button class="tab" data-route="efficiency">Efficiency</button>
          <button class="tab" data-route="scoreboard">Scoreboard</button>
          <button class="tab" data-route="alerts">Alerts</button>
        </div>
        <div class="chips" id="chips"></div>
      </nav>
      <div class="body">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content" id="content"><div id="content-inner"></div></main>
      </div>
      <footer class="foot" id="foot">
        <span id="foot-left"></span>
        <button class="link" id="btn-quit">Quit ⌘Q</button>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
